name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check (Prettier)
        run: pnpm format:check

      - name: Typecheck Shared Package
        run: pnpm --filter @selaras/shared typecheck

      - name: Run Signal Math & Schema Unit Tests
        run: pnpm --filter @selaras/shared test:coverage

      - name: Run PostgreSQL RLS & K-Anonymity Tests (PGlite)
        run: pnpm test:rls
